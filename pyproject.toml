[project]
name = "device-agent"
version = "2.0.0"
description = "终端设备 A2A Agent 服务：设备接入 (MCP)、多模态意图识别 (Gemini) 与 A2A 智能路由"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "a2a-sdk[http-server,sqlite]>=1.2.3",
    "aiosqlite>=0.22",
    "alembic>=1.16",
    "fastapi>=0.162",
    "google-genai>=2.33",
    "httpx>=0.28",
    "mcp>=2.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.31"]

[project.scripts]
device-agent = "device_agent.__main__:main"

[dependency-groups]
dev = [
    "asyncpg>=0.31",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "python-dotenv>=1.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # 行宽交给 formatter；允许中文全角标点

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: 需要真实 GEMINI_API_KEY 并访问外网的端到端测试",
    "redis: 需要本机 Redis（TEST_REDIS_URL，默认 redis://localhost:6379/15）",
    "postgres: 需要本机 PostgreSQL（TEST_POSTGRES_DSN 或 .env 中的 POSTGRES_APP_PASSWORD）",
]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
