# Alembic CLI config (keep this file ASCII-only: Alembic reads it with the system
# locale encoding, which is not UTF-8 on Chinese Windows).
# The service upgrades the database automatically on startup; manual use:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe the change"
# The database URL comes from DATABASE_URL (.env); sqlalchemy.url is left unset on purpose.
[alembic]
script_location = %(here)s/src/device_agent/migrations
path_separator = os
